name: 创建含源码的完整编译环境

on:
  push:
  workflow_dispatch:
    inputs:
    ros2_version:
      description: "编译的ros2版本"
      type: string
      required: false

env:
  ROS2_VERSION: ${{ inputs.ros2_version || 'jazzy' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4
        with:
          set-safe-directory: "${GITHUB_WORKSPACE}/build_ros2"

      - name: 计算上下文ID
        id: hash
        run: |
          ROS2_COMMIT_ID=$(git ls-remote https://github.com/ros2/ros2.git ${{ env.ROS2_VERSION }}-release | head -n 1 | awk '{print $1}')
          IMAGE_HASH=$(find . -name "Dockerfile" -o -name "full_compilation_environment.yaml" -o -name "build_docker_env.sh" \
            -type f -exec md5sum {} \; | sort | md5sum | cut -d' ' -f1)
          IMAGE_KEY="ros2-docker-image-linux-${{ env.ROS2_VERSION }}-${{ matrix.target }}-$IMAGE_HASH-$ROS2_COMMIT_ID"
          IMAGE_NAME="ros2-docker-image-linux-${{ env.ROS2_VERSION }}-${{ matrix.target }}"

          echo "image_key=$IMAGE_KEY" >> $GITHUB_OUTPUT
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

          echo "ROS2提交哈希: $ROS2_COMMIT_ID"
          echo "镜像哈希: $IMAGE_KEY"
          echo "镜像名称: $IMAGE_NAME"

      - name: 检查缓存
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.hash.outputs.image_name }}.tar
          lookup-only: true
          key: ${{ steps.hash.outputs.image_key }}

      - name: 判断是否需要构建
        id: check
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" == "true" ]; then
            echo "skip_build=true" >> $GITHUB_OUTPUT
            echo "缓存命中，跳过构建"
          else
            echo "skip_build=false" >> $GITHUB_OUTPUT
            echo "需要构建镜像"
          fi

      - name: Set up QEMU
        if: steps.check.outputs.skip_build == 'false' && matrix.target == 'arm64'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip_build == 'false'
        uses: docker/setup-buildx-action@v4

      - name: 编译和导出镜像 ${{ matrix.target }}
        if: steps.check.outputs.skip_build == 'false'
        run: |
          docker buildx create --name builder --use
          docker buildx build \
            --platform linux/${{ matrix.target }} \
            -t ros2-build:${{ matrix.target }} \
            --build-arg ROS2_VERSION=${{ env.ROS2_VERSION }} \
            --output type=docker,dest=${{ steps.hash.outputs.image_name }}.tar \
            .

      - name: 保存${{ matrix.arch }}镜像到缓存
        if: steps.check.outputs.skip_build == 'false'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.hash.outputs.image_name }}.tar
          key: ${{ steps.hash.outputs.image_key }}

      - name: 上传${{ matrix.target }}镜像
        if: steps.check.outputs.skip_build == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.hash.outputs.image_name }}
          path: ${{ steps.hash.outputs.image_name }}.tar
          retention-days: 7
          if-no-files-found: error
