name: 创建含源码的完整编译环境(x64)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      matrix:
        ros2_version: [jazzy]
        docker_base: [ubuntu:22.04, ubuntu:24.04]
        target: [amd64]

    steps:
      - uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - name: 计算上下文数据
        id: cid
        run: |
          DOCKER_BASE="${{ matrix.docker_base }}"
          DOCKER_BASE="${DOCKER_BASE//:/_}"
          ROS2_COMMIT_ID=$(git ls-remote https://github.com/ros2/ros2.git ${{ matrix.ros2_version }}-release | head -n 1 | awk '{print $1}')
          TAG_HASH=$(/bin/bash ./calculate_hash.sh Dockerfile full_compilation_environment.yaml build_docker_env.sh)
          TAG_KEY="${TAG_HASH}-${ROS2_COMMIT_ID}"
          TAG_NAME="ros2-docker-image-$(date +'%Y-%m-%d_%H%M')"
          TAG_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG_KEY}"
          IMAGE_NAME="ros2-docker-image-${DOCKER_BASE}-${{ matrix.ros2_version }}-${{ matrix.target }}"

          # 上下文hash(就是所有相关文件的hash)
          CONTEXT_HASH=$(/bin/bash ./calculate_hash.sh Dockerfile *.yaml *.sh *.cmake)

          echo "context_hash=$CONTEXT_HASH" >> $GITHUB_OUTPUT
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "tag_key=${TAG_KEY}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "tag_url=${TAG_URL}" >> $GITHUB_OUTPUT

          echo "ROS2提交哈希: $ROS2_COMMIT_ID"
          echo "镜像名称: $IMAGE_NAME"
          echo "TAG哈希:${TAG_KEY}"
          echo "TAG名称:${TAG_NAME}"
          echo "TAG URL:${TAG_URL}"

      - name: 判断是否需要构建
        id: check
        run: |
          # 调用GitHub API检查该Tag的Release是否存在
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${{ steps.cid.outputs.tag_url }})

          if [ $HTTP_CODE -eq 200 ]; then
            echo "skip_build=true" >> $GITHUB_OUTPUT
            echo "Release已存在,跳过构建"
          else
            echo "skip_build=false" >> $GITHUB_OUTPUT
            echo "需要构建镜像"
          fi

      - name: 设置Buildx
        if: steps.check.outputs.skip_build == 'false'
        uses: docker/setup-buildx-action@v4

      - name: 编译和导出镜像 ${{ matrix.target }}
        if: steps.check.outputs.skip_build == 'false'
        run: |
          docker buildx create --name builder --use
          docker buildx build \
            --platform linux/${{ matrix.target }} \
            -t ros2-build:${{ matrix.target }} \
            --build-arg ROS2_VERSION=${{ matrix.ros2_version }} \
            --build-arg BASE_IMAGE=${{ matrix.docker_base }} \
            --output type=docker,dest=${{ steps.cid.outputs.image_name }}.tar.zst,compression=zstd,compression-level=9 \
            .

      # 镜像太大了 保存到cache不行
      # - name: 保存${{ matrix.target }}镜像到缓存
      #   if: steps.check.outputs.skip_build == 'false'
      #   uses: actions/cache/save@v6
      #   with:
      #     path: ${{ steps.cid.outputs.image_name }}.tar.zst
      #     key: ${{ steps.cid.outputs.image_key }}

      # - name: 上传${{ matrix.target }}镜像
      #   if: steps.check.outputs.skip_build == 'false'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ${{ steps.cid.outputs.image_name }}
      #     path: ${{ steps.cid.outputs.image_name }}.tar.zst
      #     retention-days: 7
      #     if-no-files-found: error

      # release 单文件最大2g
      - name: 压缩Docker镜像
        if: steps.check.outputs.skip_build == 'false'
        run: |
          image_name="${{ steps.cid.outputs.image_name }}"
          split -b 1900M ${image_name}.tar.zst ${image_name}-part-
          sha256sum ${image_name}.tar.zst > ${image_name}.tar.zst.sha256
          cat "${image_name}.tar.zst.sha256"
          rm -rf ${image_name}.tar.zst

      - name: 上传Docker镜像
        if: steps.check.outputs.skip_build == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.cid.outputs.tag_key }}
          name: ${{ steps.cid.outputs.tag_name }}
          prerelease: false
          draft: false
          generate_release_notes: true
          files: |
            ${{ steps.cid.outputs.image_name }}-part-*
            *.sha256

      - name: 保存需要传递的参数
        run: |
          echo "image_name=${{ steps.cid.outputs.image_name }}" >> flow_run_id_arg
          echo "image_tag_key=${{  steps.cid.outputs.tag_key }}" >> flow_run_id_arg
          echo "image_tag_name=${{  steps.cid.outputs.tag_name }}" >> flow_run_id_arg


          echo "提交hash: ${{ github.sha }} 流程ID: ${{ github.run_id }} 传递参数: $(cat flow_run_id_arg)"

      - name: 流程参数传递
        uses: actions/cache/save@v6
        with:
          path: flow_run_id_arg
          key: ${{ steps.cid.outputs.context_hash }}-${{ matrix.docker_base }}-${{ matrix.target }}-${{ matrix.ros2_version }}
