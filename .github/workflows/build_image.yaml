name: 编译并导出镜像

on:
  # push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - name: 计算哈希
        id: hash
        run: |
          HASH=$(/bin/bash ./calculate_hash.sh Dockerfile build_image.yaml build_docker_env.sh)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "计算哈希: $HASH"

      - name: 检查缓存
        id: cache
        uses: actions/cache@v4
        with:
          path: ros2-build-image-${{ matrix.target }}.tar
          lookup-only: true
          key: docker-${{ matrix.target }}-${{ steps.hash.outputs.hash }}

      - name: 判断是否需要构建
        id: check
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" == "true" ]; then
            echo "skip_build=true" >> $GITHUB_OUTPUT
            echo "缓存命中，跳过构建"
          else
            echo "skip_build=false" >> $GITHUB_OUTPUT
            echo "需要构建镜像"
          fi

      - name: Set up QEMU
        if: steps.check.outputs.skip_build == 'false' && matrix.target == 'arm64'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip_build == 'false'
        uses: docker/setup-buildx-action@v4

      - name: 编译和导出镜像 ${{ matrix.target }}
        if: steps.check.outputs.skip_build == 'false'
        run: |
          docker buildx create --name builder --use
          docker buildx build \
            --platform linux/${{ matrix.target }} \
            -t ros2-build:${{ matrix.target }} \
            --output type=docker,dest=ros2-build-image-${{ matrix.target }}.tar \
            .

      - name: 保存${{ matrix.target }}镜像到缓存
        if: steps.check.outputs.skip_build == 'false'
        uses: actions/cache/save@v6
        with:
          path: ros2-build-image-${{ matrix.target }}.tar
          key: docker-${{ matrix.target }}-${{ steps.hash.outputs.hash }}

      - name: 上传${{ matrix.target }}镜像
        if: steps.check.outputs.skip_build == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ros2-build-image-${{ matrix.target }}
          path: ros2-build-image-${{ matrix.target }}.tar
          retention-days: 30
          if-no-files-found: error
