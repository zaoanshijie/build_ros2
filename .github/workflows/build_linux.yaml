name: 编译LinuxRos2
on:
  workflow_run:
    workflows: ["创建含源码的完整编译环境"]
    types:
      - completed

jobs:
  build_ros2_ubuntu:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      matrix:
        ros2_version: [jazzy]
        docker_base: [ubuntu:24.04, ubuntu:22.04]
        target: [amd64, arm64]
        exclude:
          # 这个会段错误 暂未解决
          - docker_base: ubuntu:22.04
            target: arm64
            ros2_version: jazzy

    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: 将存储库签出到运行器
        uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - name: 获取流程参数ID
        id: fid
        run: |
          # 上下文hash
          CONTEXT_HASH=$(/bin/bash ./calculate_hash.sh Dockerfile *.yaml *.sh *.cmake)
          echo "context_hash=$CONTEXT_HASH" >> $GITHUB_OUTPUT

      - name: 获取流程参数文件
        uses: actions/cache/restore@v6
        with:
          path: flow_run_id_arg
          key: ${{ steps.fid.outputs.context_hash }}-${{ matrix.docker_base }}-${{ matrix.target }}
          fail-on-cache-miss: true

      - name: 计算编译参数
        id: cid
        run: |
          # 逐行读取并输出
          while IFS='=' read -r key value; do
            # 跳过空行和注释
            [[ -z "$key" || "$key" =~ ^# ]] && continue

            # 去除可能的空格
            key=$(echo "$key" | xargs)
            value=$(echo "$value" | xargs)

            # 输出到GITHUB_OUTPUT
            echo "${key}=${value}" >> $GITHUB_OUTPUT
            declare "${key}=${value}"
            echo "流程参数:${key}=${value}"
          done < flow_run_id_arg


          # 处理一下变量不存在的情况
          if [ -z "$image_name" ]; then
              echo "流程错误,不存在image_name数据"
              exit 1
          fi
          if [ -z "$image_tag_key" ]; then
              echo "流程错误,不存在image_tag_key数据"
              exit 1
          fi

          DOCKER_BASE="${{ matrix.docker_base }}"
          DOCKER_BASE="${DOCKER_BASE//:/_}"
          ROS2_COMMIT_ID=$(git ls-remote https://github.com/ros2/ros2.git ${{ matrix.ros2_version }}-release | head -n 1 | awk '{print $1}')
          CONTEXT_HASH=${{ steps.fid.outputs.context_hash }}
          TAG_KEY="${CONTEXT_HASH}-${ROS2_COMMIT_ID}"
          TAG_NAME="ros2-$(date +'%Y-%m-%d_%H%M')"
          TAG_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG_KEY}"
          ROS2_NAME="ros2-${DOCKER_BASE}-${{ matrix.ros2_version }}-${{ matrix.target }}"


          echo "context_hash=$CONTEXT_HASH" >> $GITHUB_OUTPUT
          echo "ros2_name=${ROS2_NAME}" >> $GITHUB_OUTPUT
          echo "tag_key=${TAG_KEY}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "tag_url=${TAG_URL}" >> $GITHUB_OUTPUT

          echo "ROS2提交哈希: $ROS2_COMMIT_ID"
          echo "编译名称: $ROS2_NAME"
          echo "TAG哈希:${TAG_KEY}"
          echo "TAG名称:${TAG_NAME}"
          echo "TAG URL:${TAG_URL}"
          echo "镜像名称: $image_name"
          echo "镜像TAG哈希:${image_tag_key}"
          echo "镜像TAG名称:${image_tag_name}"

      - name: 判断是否需要构建
        id: check
        run: |
          # 调用GitHub API检查该Tag的Release是否存在
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${{ steps.cid.outputs.tag_url }})

          if [ $HTTP_CODE -eq 200 ]; then
            echo "skip_build=true" >> $GITHUB_OUTPUT
            echo "Release已存在,跳过构建"
          else
            echo "skip_build=false" >> $GITHUB_OUTPUT
            echo "需要构建镜像"
          fi

      - name: 下载docker镜像
        if: steps.check.outputs.skip_build == 'false'
        run: |
          image_name="${{ steps.cid.outputs.image_name }}"
          image_tag_url="https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.cid.outputs.image_tag_key }}"
          DOWNLOAD_URLS=$(curl -s ${image_tag_url} | jq -r '.assets[].browser_download_url')

          if [ -z "$DOWNLOAD_URLS" ]; then
            echo "❌ 未找到docker镜像"
            exit 1
          fi
          # 逐行读取并下载
          echo "$DOWNLOAD_URLS" | while read -r url; do
            if [ -n "$url" ]; then
              filename=$(basename "$url")
              if [[ "${filename}" == "${image_name}"* ]]; then
                echo "  ⬇️ 下载: $filename"
                curl -OL "$url"
              fi
            fi
          done
          ls -alh
          cat ${image_name}-part-* > ${image_name}.tar.zst

          if [[ -f "${image_name}.tar.zst.sha256" ]]; then
            sha256_content=$(cat "${image_name}.tar.zst.sha256")
            echo "目标hash:${sha256_content}"
            file_sha256=$(sha256sum ${image_name}.tar.zst)
            echo "文件hash:${file_sha256}"
            rm -rf *.sha256 # 删除缓存
            if [ "${sha256_content}" == "${file_sha256}" ]; then
              echo "SHA256 校验通过！"
            else
              echo "SHA256 校验失败！"
              exit 1
            fi
          else
            echo "跳过文件校验"
          fi

      - name: 设置QEMU
        if: steps.check.outputs.skip_build == 'false' && matrix.target == 'arm64'
        uses: docker/setup-qemu-action@v4
        with:
          reset: true

      - name: 设置Buildx
        if: steps.check.outputs.skip_build == 'false'
        uses: docker/setup-buildx-action@v4

      - name: 编译并打包构建产物
        if: steps.check.outputs.skip_build == 'false'
        run: |
          /bin/bash $GITHUB_WORKSPACE/run_build.sh -r "${{ matrix.ros2_version }}" -i "${{ steps.cid.outputs.image_name }}.tar.zst" -t ${{ matrix.target }}

          mv ros2.tar.bz2 ${{ steps.cid.outputs.ros2_name }}.tar.bz2

          sha256sum ${{ steps.cid.outputs.ros2_name }}.tar.bz2 > ${{ steps.cid.outputs.ros2_name }}.tar.bz2.sha256

      - name: 上传编译结果
        if: steps.check.outputs.skip_build == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.cid.outputs.tag_key }}
          name: ${{ steps.cid.outputs.tag_name }}
          prerelease: false
          draft: false
          generate_release_notes: true
          files: |
            ${{ steps.cid.outputs.ros2_name }}.tar.bz2
            *.sha256
      # - name: 保存编译结果到缓存
      #   if: steps.check.outputs.skip_build == 'false'
      #   uses: actions/cache/save@v6
      #   with:
      #     path: ${{ steps.cid.outputs.ros2_name }}.tar.bz2
      #     key: ${{ steps.cid.outputs.ros2_key }}

